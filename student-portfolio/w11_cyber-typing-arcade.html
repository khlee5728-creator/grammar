<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영문법 타자 아케이드 - 볼륨 업 에디션</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pretendard:wght@400;600;800&display=swap');

        :root {
            --bg-color: #060814;
            --panel-color: rgba(18, 22, 46, 0.85);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #8a8fae;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(157, 78, 221, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(0, 240, 255, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: var(--panel-color);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(157, 78, 221, 0.15);
            backdrop-filter: blur(20px);
            padding: 35px;
            width: 820px;
            position: relative;
        }

        h2 {
            font-family: 'Orbitron', 'Pretendard', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            margin-top: 0;
            font-size: 2.2rem;
        }

        #loginScreen {
            text-align: center;
            padding: 20px 0;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group input {
            padding: 14px;
            width: 280px;
            font-size: 1.05rem;
            border-radius: 12px;
            border: 2px solid #2a2e4e;
            background-color: rgba(10, 12, 28, 0.6);
            color: #fff;
            text-align: center;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            outline: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .game-stats {
            font-family: 'Orbitron', 'Pretendard', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .user-info {
            font-weight: 600;
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .question-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 1.35rem;
            line-height: 1.6;
            min-height: 45px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .blank {
            color: var(--neon-cyan);
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            border-bottom: 2px dashed var(--neon-cyan);
        }

        #gameArea {
            width: 100%;
            height: 380px;
            background-color: #0b0d19;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(157, 78, 221, 0.2);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .falling-option {
            position: absolute;
            background: rgba(13, 11, 34, 0.85);
            border: 2px solid var(--neon-magenta);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4), inset 0 0 8px rgba(255, 0, 127, 0.2);
            letter-spacing: 0.5px;
        }

        .falling-option:nth-child(even) {
            border-color: var(--neon-purple);
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.4), inset 0 0 8px rgba(157, 78, 221, 0.2);
        }

        .input-area {
            margin-top: 20px;
            text-align: center;
        }

        #typingInput {
            width: 85%;
            padding: 14px;
            font-size: 1.4rem;
            font-family: 'Orbitron', 'Pretendard', sans-serif;
            border-radius: 14px;
            border: 2px solid var(--neon-magenta);
            background-color: rgba(10, 12, 28, 0.8);
            color: white;
            text-align: center;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.1);
            transition: all 0.3s ease;
        }

        #typingInput:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-magenta), #7928ca);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4e5d6c, #2b353f);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .btn-secondary:hover {
            box-shadow: 0 0 20px rgba(255,255,255,0.15);
        }

        .hidden { display: none !important; }
        .warning-text { color: #ff3366; font-weight: 700; font-size: 0.95rem; text-shadow: 0 0 10px rgba(255,51,102,0.3); }
        
        .score-num {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen">
        <h2>CYBER TYPING ARCADE</h2>
        <p style="color: var(--text-muted); margin-bottom:30px;">Unit 49 문법 마스터 (고음량 오디오 칩셋 적용)</p>
        <div class="input-group">
            <input type="text" id="studentId" placeholder="학번을 입력하세요" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="text" id="studentName" placeholder="이름을 입력하세요" autocomplete="off">
        </div>
        <button class="btn" onclick="startGame()">MATRIX 접속하기</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="header-bar">
            <div class="game-stats">
                LIVES: <span id="livesDisplay">❤️❤️❤️❤️❤️</span> | SCORE: <span id="scoreDisplay" class="score-num">0</span>
            </div>
            <div class="user-info">
                USER: <span id="displayId"></span> (<span id="displayName"></span>)
            </div>
        </div>

        <div class="question-box" id="questionDisplay">
            SYSTEM LOADING...
        </div>

        <div id="gameArea">
            </div>

        <div class="input-area">
            <input type="text" id="typingInput" placeholder="여기에 정답 단어를 입력하고 ENTER를 누르세요" autocomplete="off">
            <div id="speedMessage" class="warning-text" style="margin-top:8px; height:20px;"></div>
        </div>
    </div>

    <div id="resultScreen" class="hidden" style="text-align: center;">
        <h2>MISSION OVER</h2>
        <div style="background: rgba(10, 12, 28, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius:16px; margin: 25px 0;">
            <p style="color: var(--text-muted);">전장에 기록된 요원 명단</p>
            <p>학번 / 이름: <span id="resultId" style="color:var(--neon-cyan);"></span> <span id="resultName"></span></p>
            <p style="font-size: 1.6rem; font-weight: 800; font-family:'Orbitron'; margin-bottom:0;">FINAL SCORE: <span id="finalScore" style="color:var(--neon-magenta); text-shadow: 0 0 15px rgba(255,0,127,0.5);"></span></p>
        </div>
        <button class="btn" onclick="restartGame()">재접속 (RETRY)</button>
        <button class="btn btn-secondary" onclick="quitGame()">로그아웃 (EXIT)</button>
    </div>
</div>

<script>
    const masterQuizData = [
        { q: "A: Have you locked the door? <br>B: Yes, I <span class='blank'>[ ? ]</span>.", a: "have", options: ["have", "do", "am", "locked"] },
        { q: "Mike wasn't working, but Emily <span class='blank'>[ ? ]</span>.", a: "was", options: ["was", "wasn't", "did", "working"] },
        { q: "A: I'm getting married. <br>B: You <span class='blank'>[ ? ]</span>? Really?", a: "are", options: ["are", "do", "am", "is"] },
        { q: "A: I'm tired. <br>B: So <span class='blank'>[ ? ]</span> I.", a: "am", options: ["am", "do", "neither", "was"] },
        { q: "A: I never read newspapers. <br>B: <span class='blank'>[ ? ]</span> do I.", a: "Neither", options: ["Neither", "So", "Either", "Never"] },
        { q: "I passed the exam, and so <span class='blank'>[ ? ]</span> Paul.", a: "did", options: ["did", "passed", "was", "does"] },
        { q: "Sarah can't drive, and <span class='blank'>[ ? ]</span> can Nick.", a: "neither", options: ["neither", "so", "either", "too"] },
        { q: "A: Is Kate working tomorrow? <br>B: I don't <span class='blank'>[ ? ]</span> so.", a: "think", options: ["think", "hope", "suppose", "guess"] },
        { q: "A: Will the weather be nice tomorrow? <br>B: I <span class='blank'>[ ? ]</span> so.", a: "hope", options: ["hope", "think", "don't", "hope not"] },
        { q: "A: Will it rain tonight? <br>B: I hope <span class='blank'>[ ? ]</span>.", a: "not", options: ["not", "so", "don't", "neither"] },
        { q: "I haven't seen them, but Tom <span class='blank'>[ ? ]</span>.", a: "has", options: ["has", "have", "did", "seen"] },
        { q: "A: Do you like coffee? <br>B: Yes, I <span class='blank'>[ ? ]</span>.", a: "do", options: ["do", "like", "am", "have"] },
        { q: "A: Are you tired? <br>B: No, I'm <span class='blank'>[ ? ]</span>.", a: "not", options: ["not", "am", "don't", "aren't"] },
        { q: "She can't play the piano, but he <span class='blank'>[ ? ]</span>.", a: "can", options: ["can", "can't", "does", "is"] },
        { q: "A: Did it rain yesterday? <br>B: Yes, it <span class='blank'>[ ? ]</span>.", a: "did", options: ["did", "rained", "was", "does"] },
        { q: "I'm happy, and so <span class='blank'>[ ? ]</span> you.", a: "are", options: ["are", "am", "so", "do"] },
        { q: "I don't like horror movies, and neither <span class='blank'>[ ? ]</span> my friend.", a: "does", options: ["does", "do", "neither", "so"] },
        { q: "He has arrived, and so <span class='blank'>[ ? ]</span> they.", a: "have", options: ["have", "has", "so", "did"] },
        { q: "A: Will it be expensive? <br>B: I <span class='blank'>[ ? ]</span> so.", a: "think", options: ["think", "hope", "so", "don't"] },
        { q: "A: Did they win the game? <br>B: I <span class='blank'>[ ? ]</span> so.", a: "suppose", options: ["suppose", "think", "so", "not"] },
        { q: "A: Do you know where she is? <br>B: No, I <span class='blank'>[ ? ]</span>.", a: "don't", options: ["don't", "am not", "know", "haven't"] },
        { q: "A: I've got a headache. <br>B: You <span class='blank'>[ ? ]</span>? I hope it passes soon.", a: "have", options: ["have", "do", "got", "are"] },
        { q: "A: I don't like cold weather. <br>B: Neither <span class='blank'>[ ? ]</span> I.", a: "do", options: ["do", "am", "don't", "neither"] },
        { q: "A: Is it going to rain? <br>B: I hope <span class='blank'>[ ? ]</span>. (I want it sunny.)", a: "not", options: ["not", "so", "don't", "neither"] },
        { q: "A: Are you going out tonight? <br>B: I think <span class='blank'>[ ? ]</span>.", a: "so", options: ["so", "not", "think", "going"] },
        { q: "I can't swim, and neither <span class='blank'>[ ? ]</span> my brother.", a: "can", options: ["can", "can't", "does", "is"] },
        { q: "They didn't see the movie, but we <span class='blank'>[ ? ]</span>.", a: "did", options: ["did", "didn't", "saw", "have"] },
        { q: "A: I'm not hungry. <br>B: <span class='blank'>[ ? ]</span> am I.", a: "Neither", options: ["Neither", "So", "Either", "Too"] },
        { q: "A: Will she pass the exam? <br>B: I expect <span class='blank'>[ ? ]</span>.", a: "so", options: ["so", "not", "expect", "think"] },
        { q: "A: Has he left yet? <br>B: I don't <span class='blank'>[ ? ]</span> so.", a: "think", options: ["think", "hope", "expect", "suppose"] },
        { q: "A: I love chocolate. <br>B: So <span class='blank'>[ ? ]</span> I.", a: "do", options: ["do", "am", "have", "love"] },
        { q: "Emma lives in London, but her parents <span class='blank'>[ ? ]</span>.", a: "don't", options: ["don't", "doesn't", "live", "aren't"] },
        { q: "A: I've lost my keys. <br>B: You <span class='blank'>[ ? ]</span>? Where did you lose them?", a: "have", options: ["have", "do", "lost", "did"] },
        { q: "A: Will you be late tonight? <br>B: I hope <span class='blank'>[ ? ]</span>.", a: "not", options: ["not", "so", "don't", "hope"] },
        { q: "Jack can drive, but I <span class='blank'>[ ? ]</span>.", a: "can't", options: ["can't", "don't", "am not", "can"] },
        { q: "A: I'm not ready yet. <br>B: Neither <span class='blank'>[ ? ]</span> I.", a: "am", options: ["am", "do", "not", "neither"] },
        { q: "A: I went to bed early last night. <br>B: So <span class='blank'>[ ? ]</span> I.", a: "did", options: ["did", "do", "went", "was"] },
        { q: "A: Is she coming to the party? <br>B: I suppose <span class='blank'>[ ? ]</span>.", a: "so", options: ["so", "not", "think", "suppose"] },
        { q: "A: Are they married? <br>B: I <span class='blank'>[ ? ]</span> so.", a: "think", options: ["think", "hope", "are", "married"] },
        { q: "A: I won't be able to come tomorrow. <br>B: Neither <span class='blank'>[ ? ]</span> I.", a: "will", options: ["will", "won't", "can", "do"] },
        { q: "A: He speaks German fluently. <br>B: <span class='blank'>[ ? ]</span> he? I didn't know that.", a: "Does", options: ["Does", "Is", "Speak", "Has"] },
        { q: "A: I don't have much free time. <br>B: Neither <span class='blank'>[ ? ]</span> I.", a: "do", options: ["do", "have", "don't", "am"] },
        { q: "A: Will it take a long time? <br>B: I suppose <span class='blank'>[ ? ]</span>. (It will be quick.)", a: "not", options: ["not", "so", "don't", "suppose"] },
        { q: "A: I'm learning Spanish these days. <br>B: So <span class='blank'>[ ? ]</span> I.", a: "am", options: ["am", "do", "so", "learning"] },
        { q: "She didn't call me, but he <span class='blank'>[ ? ]</span>.", a: "did", options: ["did", "didn't", "called", "does"] }
    ];

    let currentPlayList = []; 
    let lives = 5;
    let score = 0;
    let currentIdx = 0;
    
    let baseSpeed = 1.2;       
    let currentSpeed = 1.2;    
    let gameInterval = null;   
    let currentTop = 0;        
    let optionElements = [];   

    const gameAreaHeight = 380;

    /* ========================================================
       🎵 Web Audio API 실시간 네온 아케이드 주파수 신디사이저 엔진
    ======================================================== */
    let audioCtx = null;
    let musicInterval = null;
    let noteTick = 0;

    const bgmMelodies = {
        5: [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23], 
        4: [220.00, 261.63, 329.63, 261.63, 196.00, 246.94, 293.66, 246.94], 
        3: [196.00, 233.08, 277.18, 311.13, 196.00, 233.08, 277.18, 311.13], 
        2: [440.00, 466.16, 440.00, 466.16, 493.88, 523.25, 493.88, 523.25], 
        1: [587.33, 622.25, 587.33, 622.25, 659.25, 698.46, 783.99, 880.00]  
    };

    const bgmTempos = { 5: 260, 4: 210, 3: 170, 2: 130, 1: 95 };

    function startSynthBgm() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        clearInterval(musicInterval);
        const tempo = bgmTempos[lives] || 250;

        musicInterval = setInterval(() => {
            const currentMelody = bgmMelodies[lives] || bgmMelodies[5];
            const freq = currentMelody[noteTick % currentMelody.length];
            noteTick++;

            playTone(freq, (tempo / 1000) * 0.85);
        }, tempo);
    }

    function playTone(freq, duration) {
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = (lives <= 2) ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // 🔊 [볼륨 업] 기존 0.03에서 0.1로 사운드 마스터 출력 증폭
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function stopSynthBgm() {
        clearInterval(musicInterval);
    }
    /* ======================================================== */

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        const idVal = document.getElementById('studentId').value.trim();
        const nameVal = document.getElementById('studentName').value.trim();

        if(!idVal || !nameVal) {
            alert("학번과 이름을 모두 입력해 주세요!");
            return;
        }

        document.getElementById('displayId').textContent = idVal;
        document.getElementById('displayName').textContent = nameVal;

        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');

        initGameSession();
    }

    function initGameSession() {
        lives = 5;
        score = 0;
        currentIdx = 0;
        baseSpeed = 1.2; 
        noteTick = 0;
        
        currentPlayList = shuffle([...masterQuizData]);
        
        updateUI();
        startSynthBgm();
        loadQuestion();
        document.getElementById('typingInput').focus();
    }

    function updateUI() {
        document.getElementById('scoreDisplay').textContent = score;
        document.getElementById('livesDisplay').textContent = "❤️".repeat(lives) + "💔".repeat(5 - lives);
    }

    function loadQuestion() {
        if (currentIdx >= currentPlayList.length) {
            currentIdx = 0;
            baseSpeed += 0.25; 
            currentPlayList = shuffle([...masterQuizData]);
        }

        currentSpeed = baseSpeed;
        document.getElementById('speedMessage').textContent = "";

        clearInterval(gameInterval);
        const gameArea = document.getElementById('gameArea');
        gameArea.innerHTML = "";
        optionElements = [];
        currentTop = 0;

        const currentQuiz = currentPlayList[currentIdx];
        document.getElementById('questionDisplay').innerHTML = currentQuiz.q;

        const shuffledOptions = shuffle([...currentQuiz.options]);
        const laneWidth = 100 / shuffledOptions.length; 
        
        shuffledOptions.forEach((opt, index) => {
            const optDiv = document.createElement('div');
            optDiv.classList.add('falling-option');
            optDiv.textContent = opt;
            
            const randomOffset = Math.floor(Math.random() * (laneWidth - 14)); 
            const leftPosition = (index * laneWidth) + randomOffset;
            
            optDiv.style.left = leftPosition + "%";
            optDiv.style.top = "0px";
            
            gameArea.appendChild(optDiv);
            optionElements.push(optDiv);
        });

        document.getElementById('typingInput').value = "";
        gameInterval = setInterval(moveOptions, 30);
    }

    function moveOptions() {
        currentTop += currentSpeed;
        
        if (currentTop >= gameAreaHeight - 45) {
            clearInterval(gameInterval);
            handleLifeLoss(); 
            return;
        }

        optionElements.forEach(el => {
            el.style.top = currentTop + "px";
        });
    }

    document.getElementById('typingInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const typedValue = this.value.trim();
            const currentQuiz = currentPlayList[currentIdx];

            if (typedValue.toLowerCase() === currentQuiz.a.toLowerCase()) {
                score += 10;
                currentIdx++;
                updateUI();
                loadQuestion();
            } else {
                currentSpeed += 0.6; 
                document.getElementById('speedMessage').textContent = "💥 시스템 노이즈 발생! 선지 낙하 가속화!";
                this.value = "";
            }
        }
    });

    function handleLifeLoss() {
        lives--;
        updateUI();
        startSynthBgm(); 

        if (lives <= 0) {
            gameOver();
        } else {
            currentIdx++;
            loadQuestion();
        }
    }

    function gameOver() {
        clearInterval(gameInterval);
        stopSynthBgm(); 
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');

        document.getElementById('resultId').textContent = document.getElementById('studentId').value;
        document.getElementById('resultName').textContent = document.getElementById('studentName').value;
        document.getElementById('finalScore').textContent = score;
    }

    function restartGame() {
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        initGameSession();
    }

    function quitGame() {
        stopSynthBgm();
        document.getElementById('resultScreen').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('studentId').value = "";
        document.getElementById('studentName').value = "";
    }
</script>

</body>
</html>
