<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Could vs Could Have Quiz</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { color: #2c3e50; text-align: center; font-size: 24px; }
        .context-box { background-color: #e8f4fd; padding: 15px; border-left: 5px solid #3498db; margin-bottom: 20px; font-style: italic; }
        .question { font-size: 18px; margin-bottom: 20px; line-height: 1.6; }
        .blank { font-weight: bold; color: #e74c3c; text-decoration: underline; }
        .options { display: grid; gap: 10px; }
        button { padding: 12px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; }
        .option-btn { background-color: #ecf0f1; color: #2c3e50; }
        .option-btn:hover { background-color: #bdc3c7; }
        .next-btn { background-color: #2ecc71; color: white; margin-top: 20px; width: 100%; display: none; }
        #result { margin-top: 15px; font-weight: bold; text-align: center; min-height: 24px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Unit 26: Could & Could Have</h1>
    <hr>
    <div id="quiz-content">
        <div class="context-box" id="context">상황 로딩 중...</div>
        <div class="question" id="sentence">문장 로딩 중...</div>
        <div class="options" id="options"></div>
        <div id="result"></div>
        <button class="next-btn" id="next-btn" onclick="generateQuestion()">다음 문제 생성 ↻</button>
    </div>
</div>

<script>
    const data = {
        subjects: ["Minji", "Tom", "The manager", "Sarah", "They", "We"],
        actions: [
            { v: "go", p: "gone" }, { v: "buy", p: "bought" }, 
            { v: "win", p: "won" }, { v: "stay", p: "stayed" }
        ],
        places: ["the party", "the concert", "the meeting", "London"]
    };

    const templates = [
        {
            type: "could",
            getContext: () => "Look! That car is drifting. It's very dangerous.",
            getSentence: (s) => `Watch out! That car <span class="blank">_______</span> (hit) us!`,
            answer: "could hit",
            wrong: "could have hit"
        },
        {
            type: "could-have",
            getContext: () => {
                const sub = data.subjects[Math.floor(Math.random() * data.subjects.length)];
                return `${sub} had enough money to buy a car, but decided to save it instead.`;
            },
            getSentence: (s) => `${s} <span class="blank">_______</span> (buy) a car, but didn't.`,
            answer: "could have bought",
            wrong: "could buy"
        },
        {
            type: "could-have-risk",
            getContext: () => "The situation was bad. We were lucky everything went well.",
            getSentence: () => `Everything was okay, but things <span class="blank">_______</span> (be) much worse.`,
            answer: "could have been",
            wrong: "could be"
        },
        {
            type: "could-ability",
            getContext: () => "When I was young, I was very athletic.",
            getSentence: () => `I <span class="blank">_______</span> (run) very fast back then.`,
            answer: "could run",
            wrong: "could have run"
        }
    ];

    let currentAnswer = "";

    function generateQuestion() {
        const resultDiv = document.getElementById('result');
        const nextBtn = document.getElementById('next-btn');
        const optionsDiv = document.getElementById('options');
        
        resultDiv.innerText = "";
        nextBtn.style.display = "none";
        optionsDiv.style.pointerEvents = "auto";

        const template = templates[Math.floor(Math.random() * templates.length)];
        const sub = data.subjects[Math.floor(Math.random() * data.subjects.length)];
        
        document.getElementById('context').innerText = "Situation: " + template.getContext();
        document.getElementById('sentence').innerHTML = template.getSentence(sub);
        
        currentAnswer = template.answer;
        
        const choices = [template.answer, template.wrong].sort(() => Math.random() - 0.5);
        optionsDiv.innerHTML = "";
        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = choice;
            btn.onclick = () => checkAnswer(choice, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(choice, btn) {
        const resultDiv = document.getElementById('result');
        const nextBtn = document.getElementById('next-btn');
        const optionsDiv = document.getElementById('options');

        if (choice === currentAnswer) {
            resultDiv.innerText = "✅ Excellent! 정답입니다.";
            resultDiv.style.color = "#2ecc71";
            btn.style.backgroundColor = "#2ecc71";
            btn.style.color = "white";
        } else {
            resultDiv.innerText = `❌ 오답입니다. 정답은 '${currentAnswer}' 입니다.`;
            resultDiv.style.color = "#e74c3c";
            btn.style.backgroundColor = "#e74c3c";
            btn.style.color = "white";
        }
        
        optionsDiv.style.pointerEvents = "none";
        nextBtn.style.display = "block";
    }

    // 초기 실행
    generateQuestion();
</script>

</body>
</html>
