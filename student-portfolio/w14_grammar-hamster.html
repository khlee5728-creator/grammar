<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hamster Cheek Mission: Sunflower Seed Harvest</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffeed6 0%, #ffcf9e 100%);
            --panel-bg: rgba(255, 255, 255, 0.95);
            --primary-orange: #ff9d2e;
            --primary-shadow: #e07f10;
            --success-green: #4caf50;
            --fail-red: #f44336;
            --text-dark: #4a3319;
            --text-muted: #8a6d4d;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        body {
            font-family: var(--font-main);
            background: #ffecd2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        /* 16:9 가로 고정 및 모바일 반응형 컨테이너 */
        .game-wrapper {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: var(--bg-gradient);
            border: 8px solid #6b4c26;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(74, 51, 25, 0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 UI 레이어 */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            z-index: 10;
            pointer-events: none;
        }

        .counter-box {
            background: white;
            padding: 8px 16px;
            border-radius: 50px;
            border: 3px solid #6b4c26;
            box-shadow: 0 6px 0 #6b4c26;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 900;
            color: var(--text-dark);
        }

        .progress-container {
            flex: 1;
            max-width: 40%;
            background: #e0bc94;
            height: 20px;
            border-radius: 10px;
            border: 3px solid #6b4c26;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 메인 그래픽 스테이지 */
        .stage {
            flex: 1.2;
            position: relative;
            background: linear-gradient(to bottom, transparent 60%, #c4e0a5 60%, #9ccc65 100%);
            border-bottom: 4px solid #6b4c26;
        }

        /* 그래픽 에셋 배치 */
        .sunflower-container {
            position: absolute;
            right: 5%;
            bottom: 12%;
            width: 150px;
            height: 200px;
            z-index: 2;
        }

        .hamster-container {
            position: absolute;
            left: 10%;
            bottom: 12%;
            width: 160px;
            height: 160px;
            z-index: 5;
            transform-origin: bottom center;
            transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .cat-paw {
            position: absolute;
            right: -100px;
            bottom: 15%;
            width: 120px;
            height: 160px;
            z-index: 6;
            transition: right 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        /* 파티클 및 이펙트 소스 */
        .dust-cloud {
            position: absolute;
            bottom: 15%;
            left: 10%;
            width: 30px;
            height: 20px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
        }

        .effect-star {
            position: absolute;
            font-size: 24px;
            opacity: 0;
            animation: spin 1s linear infinite;
            pointer-events: none;
            z-index: 7;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 하단 퀴즈 플레이트 */
        .quiz-panel {
            flex: 1.1;
            background: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            position: relative;
        }

        .question-area {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.4;
            text-align: center;
            margin-bottom: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 3px solid #d7ccc8;
            border-bottom: 7px solid #d7ccc8;
            border-radius: 16px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: left;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background: #fffdf9;
            border-color: var(--primary-orange);
            border-bottom-color: var(--primary-shadow);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 3px;
        }

        /* 실시간 오답 해설 가림막 레이어 */
        .explanation-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff3e0;
            border-top: 4px solid var(--fail-red);
            padding: 20px 40px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 30;
        }

        .explanation-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--fail-red);
            margin-bottom: 8px;
        }

        .explanation-text {
            font-size: 16px;
            font-weight: 700;
            color: #5d4037;
            line-height: 1.5;
        }

        /* 피드백 알림 배너 */
        .feedback-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: 900;
            color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* 결과 화면 모달 */
        .result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(74, 51, 25, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .result-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .final-hamster {
            width: 220px;
            height: 220px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 36px;
            font-weight: 900;
            color: #ffeb3b;
            margin-bottom: 10px;
            text-shadow: 0 4px 0 #bc5e00;
        }

        .restart-btn {
            background: #ff9d2e;
            border: none;
            border-bottom: 6px solid #e07f10;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .restart-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake-active { animation: shake 0.4s ease-in-out; }

        @keyframes dustRun {
            0% { opacity: 0; transform: scale(0.5); left: var(--start-x); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.5); left: var(--end-x); }
        }

        @keyframes chew {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04, 0.96); }
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="gameWindow">
        <!-- TOP HUD -->
        <div class="top-hud">
            <div class="counter-box">
                <svg width="24" height="24" viewBox="0 0 32 32">
                    <path d="M16 2 C22 10, 26 18, 22 26 C18 32, 14 32, 10 26 C6 18, 10 10, 16 2 Z" fill="#4e342e"/>
                    <path d="M16 5 C20 12, 23 18, 20 24 C17 29, 14 29, 11 24 C8 18, 12 12, 16 5 Z" fill="#ffb74d"/>
                    <path d="M16 5 Q18 15 15 28" stroke="#4e342e" stroke-width="2" fill="none"/>
                </svg>
                <span id="seedCount">0</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="counter-box" id="qIndicator">1 / 10</div>
        </div>

        <!-- STAGE (INTERACTION AREA) -->
        <div class="stage" id="stageArea">
            <div class="feedback-overlay" id="feedbackBanner">정답! +1 Seed</div>
            <div class="dust-cloud" id="dustEff"></div>
            <div class="effect-star" id="star1" style="display:none;">⭐</div>

            <!-- [완전 변경] 실제 골든 햄스터 기반 해부학적 레이아웃 디자인 수용부 -->
            <div class="hamster-container" id="hamster">
                <svg viewBox="0 0 160 160" width="100%" height="100%">
                    <defs>
                        <!-- 실사 골든햄스터풍 삼색 분포 털 그라데이션 명암 -->
                        <linearGradient id="goldenFur" x1="30%" y1="0%" x2="50%" y2="100%">
                            <stop offset="0%" stop-color="#b56a27" />
                            <stop offset="45%" stop-color="#df924e" />
                            <stop offset="85%" stop-color="#f2cb9b" />
                            <stop offset="100%" stop-color="#fff0dc" />
                        </linearGradient>
                        
                        <linearGradient id="backStripes" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#733f12" stop-opacity="0.6"/>
                            <stop offset="50%" stop-color="#402005" stop-opacity="0.8"/>
                            <stop offset="100%" stop-color="#733f12" stop-opacity="0.6"/>
                        </linearGradient>

                        <radialGradient id="realEye" cx="40%" cy="35%" r="60%">
                            <stop offset="0%" stop-color="#2b1a0d"/>
                            <stop offset="75%" stop-color="#0d0602"/>
                            <stop offset="100%" stop-color="#000000"/>
                        </radialGradient>

                        <radialGradient id="earInner" cx="40%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffccd5" />
                            <stop offset="70%" stop-color="#e59d89" />
                            <stop offset="100%" stop-color="#aa6644" />
                        </radialGradient>

                        <radialGradient id="bodyShadow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="rgba(40,25,10,0.25)"/>
                            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
                        </radialGradient>
                    </defs>

                    <!-- 자연스러운 바닥 그림자 -->
                    <ellipse cx="80" cy="148" rx="48" ry="8" fill="url(#bodyShadow)"/>

                    <!-- 뒷발 (짧고 두꺼운 다리 끝에 연결된 사실적인 뭉툭 발가락 형태) -->
                    <g stroke="#402510" stroke-width="1.5" stroke-linejoin="round">
                        <!-- 왼 뒷발 -->
                        <path d="M 32,138 Q 24,146 36,147 Q 44,146 42,136 Z" fill="#ffccd5" />
                        <circle cx="28" cy="144" r="2" fill="#ffccd5"/>
                        <circle cx="32" cy="146" r="2" fill="#ffccd5"/>
                        <circle cx="36" cy="145" r="2" fill="#ffccd5"/>
                        
                        <!-- 오른 뒷발 -->
                        <path d="M 128,138 Q 136,146 124,147 Q 116,146 118,136 Z" fill="#ffccd5" />
                        <circle cx="132" cy="144" r="2" fill="#ffccd5"/>
                        <circle cx="128" cy="146" r="2" fill="#ffccd5"/>
                        <circle cx="124" cy="145" r="2" fill="#ffccd5"/>
                    </g>

                    <!-- 귀 (실제 골든 햄스터 비율에 맞춘 상단 부착 구조) -->
                    <g stroke="#361d07" stroke-width="2.5">
                        <!-- 왼쪽 귀 -->
                        <path d="M 42,42 C 30,22 52,14 60,30 C 62,36 54,46 42,42 Z" fill="#b56a27"/>
                        <path d="M 45,39 C 36,26 50,21 55,32 C 56,36 50,42 45,39 Z" fill="url(#earInner)"/>
                        <!-- 오른쪽 귀 -->
                        <path d="M 118,42 C 130,22 108,14 100,30 C 98,36 106,46 118,42 Z" fill="#b56a27"/>
                        <path d="M 115,39 C 124,26 110,21 105,32 C 104,36 110,42 115,39 Z" fill="url(#earInner)"/>
                    </g>

                    <!-- 몸통 베이스 (공 모양 탈피: 상단 헤드가 좁고 하단 골반이 무거운 물방울 형태의 쉐입) -->
                    <!-- 등과 엉덩이 털 결 굴곡 묘사 포함 -->
                    <path d="M 54,42 Q 80,36 106,42 Q 124,65 132,95 Q 136,142 80,144 Q 24,142 28,95 Q 36,65 54,42 Z" 
                          fill="url(#goldenFur)" stroke="#361d07" stroke-width="3"/>

                    <!-- 리얼 털 질감용 오버레이 무늬 (등줄기 및 등 측면 브라운 코트 패턴) -->
                    <path d="M 54,43 Q 80,38 106,43 Q 118,65 112,85 Q 80,92 48,85 Q 42,65 54,43 Z" fill="url(#backStripes)" opacity="0.35"/>
                    <path d="M 72,39 Q 80,65 80,90" stroke="#522c0a" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>
                    
                    <!-- 가슴 및 배 부분의 크림색/흰색 털 레이어 -->
                    <path d="M 48,88 Q 80,72 112,88 Q 124,124 80,142 Q 36,124 48,88 Z" fill="#ffffff" opacity="0.95"/>
                    <path d="M 58,94 Q 80,82 102,94 Q 110,120 80,134 Q 50,120 58,94 Z" fill="#fff5e6"/>

                    <!-- [핵심 메커니즘 연동 볼] 볼주머니 해부 구조 구현 (좌우 하단 턱 프레임과 직결되어 늘어나는 스케일러블 볼) -->
                    <g stroke="#361d07" stroke-width="2.5">
                        <ellipse id="leftCheek" cx="36" cy="94" rx="17" ry="17" fill="url(#goldenFur)"/>
                        <ellipse id="rightCheek" cx="124" cy="94" rx="17" ry="17" fill="url(#goldenFur)"/>
                    </g>
                    <!-- 은은한 혈색 처리 -->
                    <ellipse cx="38" cy="94" rx="10" ry="8" fill="#ff9999" opacity="0.3"/>
                    <ellipse cx="122" cy="94" rx="10" ry="8" fill="#ff9999" opacity="0.3"/>

                    <!-- 짧고 자연스러운 주둥이(Muzzle) 패드 영역 -->
                    <path d="M 64,84 Q 80,76 96,84 Q 98,102 80,102 Q 62,102 64,84 Z" fill="#ffffff" stroke="#4a2a10" stroke-width="2"/>
                    <path d="M 70,88 Q 80,95 90,88" fill="none" stroke="#e0a090" stroke-width="1.5"/>

                    <!-- 3중 반사광 피사체 묘사 - Pixar 스타일의 유리구슬 눈망울 -->
                    <g>
                        <!-- 왼쪽 눈 -->
                        <circle cx="52" cy="66" r="9" fill="url(#realEye)" stroke="#211003" stroke-width="1"/>
                        <circle id="eyeSparkleL" cx="49" cy="62" r="3.2" fill="#ffffff"/> <!-- 주광원 하이라이트 -->
                        <circle cx="55" cy="71" r="1.5" fill="#ffffff" opacity="0.6"/> <!-- 보조광 및 투명 구슬면 느낌 -->
                        <path d="M 46,56 Q 54,54 59,58" stroke="#361d07" stroke-width="2" fill="none" stroke-linecap="round"/> <!-- 옅은 눈꺼풀 깊이감 -->

                        <!-- 오른쪽 눈 -->
                        <circle cx="108" cy="66" r="9" fill="url(#realEye)" stroke="#211003" stroke-width="1"/>
                        <circle id="eyeSparkleR" cx="105" cy="62" r="3.2" fill="#ffffff"/>
                        <circle cx="111" cy="71" r="1.5" fill="#ffffff" opacity="0.6"/>
                        <path d="M 114,56 Q 106,54 101,58" stroke="#361d07" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </g>

                    <!-- 리얼 핑크 콤팩트 코와 입술 스티치 -->
                    <polygon points="80,84 75,79 85,79" fill="#ff94a5" stroke="#361d07" stroke-width="1.5"/>
                    <path d="M 74,89 Q 80,94 80,88 Q 80,94 86,89" fill="none" stroke="#361d07" stroke-width="2.5" stroke-linecap="round"/>

                    <!-- 실제 햄스터 특유의 섬세하고 짧은 수염 (Whiskers) -->
                    <g stroke="#5c4033" stroke-width="1.2" opacity="0.8" stroke-linecap="round">
                        <!-- 왼쪽 수염 -->
                        <line x1="60" y1="86" x2="28" y2="82"/>
                        <line x1="58" y1="90" x2="24" y2="92"/>
                        <line x1="60" y1="94" x2="30" y2="102"/>
                        <!-- 오른쪽 수염 -->
                        <line x1="100" y1="86" x2="132" y2="82"/>
                        <line x1="102" y1="90" x2="136" y2="92"/>
                        <line x1="100" y1="94" x2="130" y2="102"/>
                    </g>

                    <!-- 자연스러운 앞발 (가슴 앞에 모으고 있는 리얼 핑거 실루엣) -->
                    <g stroke="#361d07" stroke-width="2" stroke-linejoin="round">
                        <path d="M 62,112 Q 54,124 66,124 Q 72,122 70,112 Z" fill="#ffccd5" />
                        <path d="M 98,112 Q 106,124 94,124 Q 88,122 90,112 Z" fill="#ffccd5" />
                        <circle cx="60" cy="122" r="1.2" fill="#ffccd5"/><circle cx="64" cy="124" r="1.2" fill="#ffccd5"/><circle cx="68" cy="123" r="1.2" fill="#ffccd5"/>
                        <circle cx="100" cy="122" r="1.2" fill="#ffccd5"/><circle cx="96" cy="124" r="1.2" fill="#ffccd5"/><circle cx="92" cy="123" r="1.2" fill="#ffccd5"/>
                    </g>
                </svg>
            </div>

            <!-- 해바라기 오브젝트 -->
            <div class="sunflower-container">
                <svg viewBox="0 0 120 160" width="100%" height="100%">
                    <path d="M60,90 L60,160" stroke="#7cb342" stroke-width="8" stroke-linecap="round"/>
                    <path d="M60,120 Q30,110 35,100 Q45,100 60,115" fill="#7cb342" stroke="#4a3319" stroke-width="3"/>
                    <path d="M60,135 Q90,125 85,115 Q75,115 60,130" fill="#7cb342" stroke="#4a3319" stroke-width="3"/>
                    <g fill="#ffca28" stroke="#4a3319" stroke-width="3">
                        <circle cx="60" cy="50" r="42"/>
                        <circle cx="60" cy="20" r="16"/> <circle cx="60" cy="80" r="16"/>
                        <circle cx="30" cy="50" r="16"/> <circle cx="90" cy="50" r="16"/>
                        <circle cx="38" cy="28" r="16"/> <circle cx="82" cy="72" r="16"/>
                        <circle cx="82" cy="28" r="16"/> <circle cx="38" cy="72" r="16"/>
                    </g>
                    <circle cx="60" cy="50" r="26" fill="#5d4037" stroke="#4a3319" stroke-width="4"/>
                    <circle cx="52" cy="44" r="3" fill="#2d1500"/><circle cx="68" cy="44" r="3" fill="#2d1500"/>
                    <circle cx="60" cy="58" r="4" fill="#2d1500"/><circle cx="48" cy="54" r="2.5" fill="#2d1500"/>
                    <circle cx="72" cy="52" r="2.5" fill="#2d1500"/>
                </svg>
            </div>

            <!-- 고양이 앞발 -->
            <div class="cat-paw" id="catPaw">
                <svg viewBox="0 0 100 150" width="100%" height="100%">
                    <path d="M20,150 L20,40 Q20,10 50,10 Q80,10 80,40 L80,150 Z" fill="#cfd8dc" stroke="#4a3319" stroke-width="4"/>
                    <ellipse cx="50" cy="35" rx="16" ry="12" fill="#ff8a80"/>
                    <circle cx="28" cy="55" r="7" fill="#ff8a80"/><circle cx="50" cy="62" r="8" fill="#ff8a80"/><circle cx="72" cy="55" r="7" fill="#ff8a80"/>
                    <path d="M28,40 L28,32" stroke="#4a3319" stroke-width="3" stroke-linecap="round"/>
                    <path d="M50,18 L50,10" stroke="#4a3319" stroke-width="3" stroke-linecap="round"/>
                    <path d="M72,40 L72,32" stroke="#4a3319" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <!-- QUIZ PANEL (해설 레이어 포함 내장형 구조) -->
        <div class="quiz-panel">
            <div class="question-area" id="questionText">문제를 불러오는 중입니다...</div>
            <div class="options-grid" id="optionsGrid"></div>
            
            <!-- 오답 시 동적으로 채워질 실시간 3~4초 해설 배너 레이어 -->
            <div class="explanation-layer" id="explanationLayer">
                <div class="explanation-title" id="expTitle">앗! 오답입니다</div>
                <div class="explanation-text" id="expText">해설 내용이 여기에 로드됩니다.</div>
            </div>
        </div>

        <!-- FINAL VICTORY MODAL -->
        <div class="result-screen" id="resultScreen">

    <!-- Web Audio API 오디오 엔진 -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }
    </script>

    <!-- CORE GAME GAMEPLAY LOGIC (해설 레이어 딜레이 메커니즘 장착) -->
    <script>
        const questions = [
            {
                q: "상황: 빙판길을 걸어가는데 미끄러져서 다칠까 봐 두려운 상황입니다. 가장 자연스러운 표현은?",
                opts: ["I was afraid of falling on the ice.", "I was afraid to fall on the ice."],
                answer: 0,
                exp: "afraid of -ing는 내 통제력을 벗어난 '우연한 사고나 위험한 결과'가 일어날까 봐 두려워할 때 씁니다. 미끄러지는 것은 주체가 의도한 행동이 아니므로 'of falling'이 정답입니다."
            },
            {
                q: "상황: 친구가 키우는 사나운 개가 물까 봐 무서워서 근처에 다가가지 않기로 선택했습니다.",
                opts: ["I was afraid of going near the dog.", "I was afraid to go near the dog."],
                answer: 1,
                exp: "afraid to-V는 주체가 무서워서 특정 행동을 '의도적으로 기피하거나 거부'할 때 사용합니다. 개에게 다가가는 행동 자체를 하지 않기로 직접 결정한 것이므로 'to go'가 정답입니다."
            },
            {
                q: "상황: 내 진로와 미래 계획을 세우던 도중, 내년에 나만의 독창적인 온라인 쇼핑몰을 여는 것에 심취해 있습니다.",
                opts: ["I'm interested in starting an online store.", "I'm interested to start an online store."],
                answer: 0,
                exp: "interested in -ing는 무언가를 하고 싶어서 지속적인 관심, 취미, 진로를 깊이 고려하고 고민하고 있는 장기적인 심리 상태를 나타냅니다."
            },
            {
                q: "상황: 어제 길을 가다가 신문 기사에서 내 고향 친구가 큰 상을 받았다는 영광스러운 소식을 처음 접했습니다.",
                opts: ["I was interested in hearing that news.", "I was interested to hear that news."],
                answer: 1,
                exp: "interested to-V는 see, hear, know 등의 동사와 결합하여, 어떠한 사실이나 소식을 '알게 된 순간 일시적으로 귀가 솔깃하고 흥미로운 반응'을 보이는 상태를 표출합니다."
            },
            {
                q: "상황: 늦은 밤 도서관에서 공부하는 학우의 어깨를 치며 말을 걸어야 하는 상황입니다. 대화 시작 직전의 양해 구하기는?",
                opts: ["I'm sorry to bother you, but can I ask a question?", "I'm sorry for bothering you, but can I ask a question?"],
                answer: 0,
                exp: "sorry to-V는 무언가를 '하려는 행동과 동시에' 유감이나 미안함을 전하는 화용론적 장치입니다. 방해하기 직전이나 방해하려는 타이밍에 운을 띄울 때는 'to bother'를 씁니다."
            },
            {
                q: "상황: 어제 술자리에서 말다툼 도중감정을 다스리지 못하고 친구에게 크게 소리를 질렀던 과거가 후회됩니다.",
                opts: ["I'm sorry to shout at you yesterday.", "I'm sorry for shouting at you yesterday."],
                answer: 1,
                exp: "sorry for -ing는 이미 '과거에 벌어진 완료된 귀책사유나 행동적 사실'에 대해 정식으로 후회하고 사과할 때 쓰는 정석 구조입니다."
            },
            {
                q: "상황: 절친한 친구가 가고 싶어 하던 유명 대기업 최종 면접에서 탈락했다는 슬픈 소식을 문자메시지로 확인했습니다.",
                opts: ["I was sorry for hearing you didn't get the job.", "I was sorry to hear you didn't get the job."],
                answer: 1,
                exp: "sorry to hear/see는 타인의 불행이나 안타까운 소식을 접했을 때 상냥하게 '공감적 위로'를 건네는 절대적인 관용 표현입니다."
            },
            {
                q: "상황: 밤길을 가다가 어두운 골목길에서 강도를 만나 위협을 당해 지갑을 빼앗길까 봐 소름이 돋고 심장이 뜁니다.",
                opts: ["I was afraid of being robbed.", "I was afraid to be robbed."],
                answer: 0,
                exp: "강도를 당하는 수동적인 피해 상황은 주어의 가해 의도나 통제 영역 밖에서 일어나는 위험 결과물입니다. 따라서 우려의 의미인 'of being robbed'가 완벽합니다."
            },
            {
                q: "상황: 아주 중요한 비즈니스 계약서를 검토하는 도중, 상대방 회사 사장에게 계약 파기 통보를 지금 입 밖으로 내야 합니다.",
                opts: ["I'm sorry for saying that we have to cancel the deal.", "I'm sorry to say that we have to cancel the deal."],
                answer: 1,
                exp: "상대에게 유감스러운 안 좋은 소식을 '지금 말하게 되어 마음이 무겁다'며 정중히 서두를 꺼낼 때는 무조건 'sorry to say ~' 문형을 활용합니다."
            },
            {
                q: "상황: 해외 유학 준비 서류를 작성하고 있는 학부생입니다. 교환학생 신청 방식에 대해 더 구체적으로 알아보고 싶을 때 쓸 수 있는 자연스러운 표현은?",
                opts: ["I would be interested to know more details.", "I would be interested in knowing more details."],
                answer: 0,
                exp: "가정/조건을 내포하는 조동사구 'would be interested' 뒤에서 정보를 획득하고 싶어 하는 특정 계기를 맞이할 때는 표준적으로 'to know/to find out' 구조와 호응합니다."
            }
        ];

        let curQText = 0;
        let score = 0;
        let currentCheekRadius = 17; // 리얼 볼사이즈 매핑 변수 기초값 조정 (17px)

        const hamster = document.getElementById('hamster');
        const catPaw = document.getElementById('catPaw');
        const progressBar = document.getElementById('progressBar');
        const seedCount = document.getElementById('seedCount');
        const qIndicator = document.getElementById('qIndicator');
        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackBanner = document.getElementById('feedbackBanner');
        const resultScreen = document.getElementById('resultScreen');
        const stageArea = document.getElementById('stageArea');
        const expLayer = document.getElementById('explanationLayer');
        const expText = document.getElementById('expText');

        const leftCheek = document.getElementById('leftCheek');
        const rightCheek = document.getElementById('rightCheek');
        const sparkL = document.getElementById('eyeSparkleL');
        const sparkR = document.getElementById('eyeSparkleR');

        function initGame() {
            curQText = 0;
            score = 0;
            currentCheekRadius = 17;
            seedCount.innerText = score;
            resultScreen.classList.remove('active');
            expLayer.style.display = 'none';
            updateCheekVisuals();
            renderQuestion();
        }

        function renderQuestion() {
            if (curQText >= questions.length) {
                showEndScreen();
                return;
            }

            qIndicator.innerText = `${curQText + 1} / 10`;
            progressBar.style.width = `${(curQText / questions.length) * 100}%`;

            const currentObj = questions[curQText];
            questionText.innerText = currentObj.q;
            optionsGrid.innerHTML = '';

            currentObj.opts.forEach((optStr, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optStr;
                btn.onclick = () => selectOption(idx);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(chosenIdx) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const currentObj = questions[curQText];
            const correctIdx = currentObj.answer;

            if (chosenIdx === correctIdx) {
                handleCorrectAnswer();
            } else {
                handleIncorrectAnswer(currentObj.exp);
            }
        }

        function handleCorrectAnswer() {
            score++;
            playSound('correct');
            seedCount.innerText = score;

            sparkL.setAttribute('r', '5.5');
            sparkR.setAttribute('r', '5.5');
            hamster.style.transform = 'scale(1.1, 0.9)';

            setTimeout(() => {
                createDustParticles();
                hamster.style.transition = 'left 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s';
                hamster.style.left = '65%';
                hamster.style.transform = 'skewX(-12deg) scale(1.08, 0.92)';
            }, 200);

            setTimeout(() => {
                currentCheekRadius += 2.5; // 정답 맞출 때마다 골든 햄스터 볼주머니 부피 누적 가중
                updateCheekVisuals();

                showBanner('정답! 해바라기씨 수확 🌻', 'var(--success-green)');

                hamster.style.left = '10%';
                hamster.style.transform = 'scale(1, 1)';
                hamster.style.animation = 'chew 0.15s infinite ease-in-out';
                sparkL.setAttribute('r', '3.2');
                sparkR.setAttribute('r', '3.2');
            }, 650);

            setTimeout(() => {
                hamster.style.animation = 'none';
                hamster.style.transition = 'left 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
                curQText++;
                renderQuestion();
            }, 1500);
        }

        function handleIncorrectAnswer(explanationStr) {
            playSound('wrong');

            hamster.style.transition = 'left 0.3s ease-in';
            hamster.style.left = '42%';

            setTimeout(() => {
                catPaw.style.right = '20%';
                stageArea.classList.add('shake-active');
                showBanner('쿵! 고양이 손에 막혔습니다 🐾', 'var(--fail-red)');
                
                hamster.style.transition = 'all 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                hamster.style.left = '18%';
                hamster.style.transform = 'rotate(-30deg) scale(0.92)';
                triggerStars();
            }, 250);

            setTimeout(() => {
                expText.innerText = explanationStr;
                expLayer.style.display = 'flex';
            }, 500);

            setTimeout(() => {
                expLayer.style.display = 'none';
                catPaw.style.right = '-100px';
                hamster.style.left = '10%';
                hamster.style.transform = 'rotate(0deg) scale(1)';
                stageArea.classList.remove('shake-active');
                hideStars();
                curQText++;
                renderQuestion();
            }, 4000);
        }

        function updateCheekVisuals() {
            leftCheek.setAttribute('rx', currentCheekRadius);
            leftCheek.setAttribute('ry', currentCheekRadius);
            rightCheek.setAttribute('rx', currentCheekRadius);
            rightCheek.setAttribute('ry', currentCheekRadius);
        }

        function createDustParticles() {
            const dust = document.getElementById('dustEff');
            dust.style.setProperty('--start-x', '15%');
            dust.style.setProperty('--end-x', '55%');
            dust.style.animation = 'dustRun 0.4s ease-out';
            setTimeout(() => { dust.style.animation = 'none'; }, 400);
        }

        function triggerStars() {
            const s1 = document.getElementById('star1');
            s1.style.left = '30%';
            s1.style.top = '40%';
            s1.style.display = 'block';
            s1.style.opacity = '1';
        }

        function hideStars() {
            document.getElementById('star1').style.display = 'none';
        }

        function showBanner(text, color) {
            feedbackBanner.innerText = text;
            feedbackBanner.style.background = color;
            feedbackBanner.style.opacity = '1';
            feedbackBanner.style.transform = 'translate(-50%, -50%) scale(1)';
            setTimeout(() => {
                feedbackBanner.style.opacity = '0';
                feedbackBanner.style.transform = 'translate(-50%, -50%) scale(0.5)';
            }, 1200);
        }

        function showEndScreen() {
            progressBar.style.width = '100%';
            document.getElementById('finalScore').innerText = `수확한 씨앗 총합: ${score} / 10개`;
            
            const titleEl = document.getElementById('resTitle');
            const descEl = document.getElementById('resDesc');
            
            if (score >= 8) {
                titleEl.innerText = "🌻 완벽한 대수확 성공!";
                descEl.innerText = "Unit 64 마스터! 실제 골든 햄스터의 터질 듯 빵빵한 볼주머니를 채워주셨습니다!";
            } else if (score >= 5) {
                titleEl.innerText = "🐹 나름 든든한 가을 준비";
                descEl.innerText = "볼주머니가 절반쯤 통통해졌습니다. 오답 해설판에서 보았던 핵심 문법을 복습해보세요.";
            } else {
                titleEl.innerText = "😭 텅 비어버린 볼주머니";
                descEl.innerText = "고양이 발바닥이 영리했네요! 정교한 문법 해설 힌트를 디딤돌 삼아 재도전하세요.";
            }

            resultScreen.classList.add('active');
        }

        window.onload = initGame;
    </script>
